# Example WSL Configuration File
# Copy this to /etc/wsl.conf to fix DNS issues in WSL
#
# Location: /etc/wsl.conf
# Command:  sudo cp example-wsl.conf /etc/wsl.conf
#
# After copying, restart WSL:
#   1. Open PowerShell (Windows)
#   2. Run: wsl --shutdown
#   3. Open WSL again

[network]
# Prevent WSL from auto-generating /etc/resolv.conf
# This allows us to set custom DNS servers that actually work
generateResolvConf = false

# Optional settings (uncomment if needed):

# [automount]
# Mount Windows drives with specific options
# enabled = true
# root = /mnt/
# options = "metadata,umask=22,fmask=11"

# [interop]
# Allow running Windows executables from WSL
# enabled = true
# appendWindowsPath = true

# [user]
# Set default user (replace YOUR_USERNAME with your WSL username)
# default = YOUR_USERNAME
