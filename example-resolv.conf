# Example DNS Configuration File
# Copy this to /etc/resolv.conf to fix DNS resolution in WSL
#
# Location: /etc/resolv.conf
#
# IMPORTANT: First copy example-wsl.conf to /etc/wsl.conf
#            Otherwise WSL will overwrite this file!
#
# Commands:
#   sudo rm /etc/resolv.conf
#   sudo cp example-resolv.conf /etc/resolv.conf
#
# After copying, test with:
#   curl -s https://google.com | head -1

# Google Public DNS (fast, reliable)
nameserver 8.8.8.8

# Cloudflare Public DNS (fast, privacy-focused)
nameserver 1.1.1.1

# Google Public DNS (backup)
nameserver 8.8.4.4

# Alternative DNS servers you can use:
#
# Cloudflare (backup):
#   nameserver 1.0.0.1
#
# Quad9 (security-focused, blocks malware):
#   nameserver 9.9.9.9
#
# OpenDNS:
#   nameserver 208.67.222.222
#   nameserver 208.67.220.220
#
# Your router/gateway (if you prefer local DNS):
#   nameserver 192.168.1.1
#
# Your ISP's DNS (check your network settings):
#   nameserver YOUR_ISP_DNS_IP
